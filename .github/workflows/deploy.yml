name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy by hand — useful when only the Instagram feed or the
  # calendar has changed, since neither lives in the repo.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a finished build
# always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: yarn

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: yarn install --frozen-lockfile

      - name: Build
        env:
          # base_path is '/dcac-website' for project Pages and '' for a custom
          # domain, so this yields the right Vite base either way.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ secrets.VITE_GOOGLE_CALENDAR_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: yarn build

      - name: Add SPA fallback
        # Pages has no rewrite rules, so a deep link like /schedule would 404.
        # Serving the app from 404.html lets the client router take over.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5