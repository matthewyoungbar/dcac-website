name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy by hand — useful when only the Instagram feed or the
  # calendar has changed, since neither lives in the repo.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a finished build
# always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: yarn

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: yarn install --frozen-lockfile

      - name: Build
        env:
          # base_path is '/dcac-website' for project Pages and '' for a custom
          # domain, so this yields the right Vite base either way.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # absolute URL for link-preview tags (og:image, og:url) — see src/pageMeta.ts
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ secrets.VITE_GOOGLE_CALENDAR_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: yarn build

      # No SPA fallback step needed: the build prerenders every page to its own
      # <route>/index.html (so deep links get a 200) plus a real 404.html for
      # unknown paths. See src/prerender.tsx.

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5